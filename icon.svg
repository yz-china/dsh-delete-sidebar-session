<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-session-purge">
  <defs>
    <linearGradient id="trashBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e05555"/>
      <stop offset="1" stop-color="#b83232"/>
    </linearGradient>
    <linearGradient id="lidTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f07a7a"/>
      <stop offset="1" stop-color="#c93f3f"/>
    </linearGradient>
  </defs>

  <!-- 会话气泡（被丢弃的对象） -->
  <g opacity="0.9">
    <rect x="17" y="8" width="30" height="18" rx="6" fill="#3d4a63"/>
    <path d="M23 26 L23 31 L30 26 Z" fill="#3d4a63"/>
    <circle cx="24" cy="17" r="1.8" fill="#9fb2d0"/>
    <circle cx="32" cy="17" r="1.8" fill="#9fb2d0"/>
    <circle cx="40" cy="17" r="1.8" fill="#9fb2d0"/>
  </g>

  <!-- 盖沿 -->
  <rect x="12" y="30" width="40" height="6" rx="3" fill="url(#lidTop)"/>
  <!-- 提手 -->
  <path d="M26 30 v-3.5 a2 2 0 0 1 2-2 h8 a2 2 0 0 1 2 2 V30"
        fill="none" stroke="url(#lidTop)" stroke-width="3" stroke-linecap="round"/>

  <!-- 桶身 -->
  <path d="M16 38 h32 l-2.6 18.5 a4 4 0 0 1-3.97 3.5 H22.57 a4 4 0 0 1-3.97-3.5 Z"
        fill="url(#trashBody)"/>

  <!-- 桶身竖纹 -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round">
    <line x1="25" y1="43" x2="24" y2="55"/>
    <line x1="32" y1="43" x2="32" y2="55"/>
    <line x1="39" y1="43" x2="40" y2="55"/>
  </g>
</svg>
