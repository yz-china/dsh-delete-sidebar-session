name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show toolchain
        run: node -v && npm -v

      - name: Run tests
        run: |
          node test.mjs
          node test-suppress.mjs
          node test-locale.mjs
          node test-archived.mjs
          node test-timeout.mjs
          node e2e.mjs

      - name: Pack
        id: pack
        run: |
          npm pack
          TGZ=$(ls *.tgz | head -n1)
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$TGZ" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "Packed: $TGZ"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: '*.tgz'
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
          fail_on_unmatched_files: true

  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::未配置 NPM_TOKEN secret，跳过 npm 发布"
            exit 0
          fi
          npm publish --access public
