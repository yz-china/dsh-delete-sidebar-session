name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # OIDC 令牌签发：Trusted Publishing 靠它向 npm 证明「这次发布来自这个仓库的
  # 这个 workflow」，从而完全不需要长期 token。
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show toolchain
        run: node -v && npm -v

      - name: Run tests
        run: |
          node test.mjs
          node test-suppress.mjs
          node test-locale.mjs
          node test-archived.mjs
          node test-timeout.mjs
          node e2e.mjs

      - name: Pack
        id: pack
        run: |
          npm pack
          TGZ=$(ls *.tgz | head -n1)
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$TGZ" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "Packed: $TGZ"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: '*.tgz'
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
          fail_on_unmatched_files: true

  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 自带 npm 11+，这是 OIDC 发布的前提：npm 10.x 不会在 PUT 请求上
      # 附带 OIDC 认证头，registry 会回 404/401。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Show toolchain
        run: |
          node -v
          npm -v

      # 两种模式：
      #   A. 已配置 Trusted Publishing（推荐）→ 不设 NODE_AUTH_TOKEN，npm 自动用 OIDC
      #   B. 仍持有 NPM_TOKEN secret → 回退到 token 认证
      # 判据是 secret 是否存在，两条路都能发布，不需要改 workflow。
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::使用 NPM_TOKEN secret 发布"
            npm publish --access public
          else
            echo "::notice::未配置 NPM_TOKEN，尝试通过 Trusted Publishing (OIDC) 发布"
            # 关键：清掉 setup-node 写进 .npmrc 的空 authToken 行。
            # 留着它会让 npm 认为要走 token 认证，从而不发起 OIDC 交换。
            if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
              sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
              echo "已从 .npmrc 移除 authToken 行"
            fi
            npm publish --access public
          fi
